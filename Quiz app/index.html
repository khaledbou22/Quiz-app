<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.gstatic.com">

<body>
  <div id="parent" class="btn">
    
        <div class="timeover hiddentimeover">
            Time over ...
        </div>
        <button id="startbtn">Start Quiz 🚀</button>
        <div class="question hidden" >
            <div class="text">
                
            </div>
            <div class="timer">
                00 ; 00
            </div>
            <button class="previous before">
                previous
            </button>
        </div>
        <div class="choicesparent hidden" >
            <div class="result">
                <div class="truthresult">
                    <h1>correct answer</h1>
                </div>
                <div class="falseresult">
                    <h1>false answer</h1>
                </div>
            </div>
            <ol>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ol>
            <button id="submitbtn">Next Question →</button>
        </div>
    <div class="quiz review">
        <h1>Quiz Review</h1>
        <div class="reviewq 1">
            <div id="quizquestion">
                <div>1</div>
                <div> </div>
            </div>
            <div class="line"></div>
            <div class="youranswer both">
                <div>❌ your answer :</div>
                <div> </div>
            </div>
              <div class=" correctanswer both">
                <div>✅  correct answer :</div>
                <div> </div>
            </div>
        </div>
        <div class="reviewq 2">

        </div>

        </div>
        <div class="reviewq 4">
